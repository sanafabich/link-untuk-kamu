<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spesial Buat Kamu ❤️</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="card" id="app">
      <div class="heart-big" id="loveButton">♥</div>
      <p class="tap-hint">Tekan love di atas yaa ❤️</p>

      <h1 id="title">Loading dulu...</h1>
      <p id="message" class="message">Aku punya sesuatu buat kamu.</p>

      <button class="next-btn" id="nextButton">Klik untuk Lanjut ya!</button>
    </section>

    <section class="card hidden" id="giftSection">
      <h2>Kamu pilih kadonya yaa 🎁</h2>
      <p>Nanti aku akan berikan.</p>

      <div class="gifts">
        <button class="gift" data-gift="Kue ultah 🎂">🎂<span>Kue ultah</span></button>
        <button class="gift" data-gift="Es krim 🍦">🍦<span>Es krim</span></button>
        <button class="gift" data-gift="Cinta tulusku ❤️">💗<span>Cinta tulusku</span></button>
        <button class="gift" data-gift="Kasih sayangku 💕">💖<span>Kasih sayangku</span></button>
      </div>

      <p id="giftResult" class="result"></p>
      <button class="next-btn" id="giftNext">Klik untuk Lanjut ya!</button>
    </section>

    <section class="card hidden" id="messageSection">
      <h2>Aku mau bilang sesuatu... 💌</h2>
      <p id="longMessage"></p>
      <button class="next-btn" id="messageNext">Klik untuk Lanjut ya!</button>
    </section>

    <section class="card hidden" id="formSection">
      <h2>ay lopyu doling doling ❤️</h2>
      <p>Tulis sesuatu untuk yaa...</p>
      <textarea id="reply" placeholder="Tulis pesan kamu di sini..."></textarea>
      <button class="next-btn" id="sendButton">Kirim</button>
      <p id="sendResult" class="result"></p>
    </section>
  </main>

  <script src="a.js"></script>
</body>
</html>
